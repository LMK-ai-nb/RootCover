name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/install-moon.ps1"
          & "$env:RUNNER_TEMP/install-moon.ps1"
          "$env:USERPROFILE/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --native
      - run: git diff --exit-code -- '*.mbti'
      - name: Browser integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/rootcover-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          python tests/browser.py
      - name: Upload reproducible validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            artifacts/validation.json
            artifacts/oracle.json
            artifacts/paving-oracle.json
            artifacts/package-check.json
